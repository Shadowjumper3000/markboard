# Production Docker Compose Configuration
services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/app/Dockerfile
    image: markboard-app:latest
    container_name: markboard-app
    expose:
      - "8000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-markboard}
      - FLASK_ENV=production
      - DEBUG=false
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - ADMIN_EMAIL=${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
    volumes:
      - markboard-app-data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - markboard-internal
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: ../deployment/docker/web/Dockerfile
    image: markboard-web:latest
    container_name: markboard-web
    expose:
      - "80"
    environment:
      - SERVER_NAME=${SERVER_NAME:-markboard.davidhoerz.com}
    networks:
      - proxy
      - markboard-internal
    restart: unless-stopped

  db:
    build:
      context: ../docker/db
      dockerfile: Dockerfile
    image: markboard-db:latest
    container_name: markboard-db
    expose:
      - "3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?MYSQL_PASSWORD is required}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-markboard}
      - MYSQL_USER=${MYSQL_USER:-admin}
    volumes:
      - markboard-db-data:/var/lib/mysql
    healthcheck:
      test: mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - markboard-internal
    restart: unless-stopped

volumes:
  markboard-db-data:
  markboard-app-data:

networks:
  proxy:
    external: true
    name: proxy
  markboard-internal:
    driver: bridge

