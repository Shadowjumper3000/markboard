# Development Docker Compose Configuration
services:
  backend:
    build:
      context: ../..
      dockerfile: deployment/docker/app/Dockerfile.dev
    image: markboard-app:dev
    container_name: markboard-app-dev
    ports:
      - "8000:8000"
    environment:
      - MYSQL_HOST=db
      - MYSQL_PORT=3306
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=adminpassword
      - MYSQL_DATABASE=markboard
      - FLASK_ENV=development
      - DEBUG=true
      - JWT_SECRET=dev_secret_change_in_production
      - ADMIN_EMAIL=admin@markboard.dev
      - ADMIN_PASSWORD=admin123dev
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../../app:/app/app:ro
      - ../../config:/app/config:ro
    restart: unless-stopped

  web:
    build:
      context: ../../web
      dockerfile: ../deployment/docker/web/Dockerfile.dev
    image: markboard-web:dev
    container_name: markboard-web-dev
    ports:
      - "80:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ../../web/src:/app/src:ro
      - ../../web/package.json:/app/package.json:ro
      - ../../web/bun.lockb:/app/bun.lockb:rw
    restart: unless-stopped

  db:
    build:
      context: ../docker/db
      dockerfile: Dockerfile
    image: markboard-db:dev
    container_name: markboard-db-dev
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=rootpassword
      - MYSQL_DATABASE=markboard
      - MYSQL_USER=admin
      - MYSQL_PASSWORD=adminpassword
    healthcheck:
      test: mysqladmin ping -h localhost -u$$MYSQL_USER -p$$MYSQL_PASSWORD
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

