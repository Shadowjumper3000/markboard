name: Deploy Manual

on:
  workflow_dispatch:
    inputs:
      deploy_branch:
        description: Branch to deploy to production
        required: true
        default: prod
        type: string

jobs:
  deploy:
    name: Deploy Selected Branch to Hetzner
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy selected branch
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            set -e
            DEPLOY_BRANCH="${{ github.event.inputs.deploy_branch || 'prod' }}"
            APP_DIR="/home/${{ secrets.HETZNER_USER }}/markboard"

            echo "Deploying branch: $DEPLOY_BRANCH"
            
            # Create directory if needed
            mkdir -p "$APP_DIR" && cd "$APP_DIR"
            
            # Clone or update repository
            if [ ! -d ".git" ]; then
              git clone --branch "$DEPLOY_BRANCH" --single-branch https://github.com/${{ github.repository }}.git .
            else
              git fetch origin "$DEPLOY_BRANCH"
              git checkout -B "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"
              git reset --hard "origin/$DEPLOY_BRANCH"
              git clean -fd
            fi
            
            # Create .env file from individual secrets
            mkdir -p deployment/compose
            cat > deployment/compose/.env << EOF
            MYSQL_HOST=db
            MYSQL_PORT=3306
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_USER=admin
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DATABASE=markboard
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FLASK_ENV=production
            DEBUG=false
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            SERVER_NAME=${{ secrets.SERVER_NAME }}
            EOF
            
            # Debug: Check if .env was created and has content
            echo "📋 Checking .env file:"
            ls -lh deployment/compose/.env
            echo "📄 .env has $(wc -l < deployment/compose/.env) lines"
            
            # Deploy with Docker Compose
            cd deployment/compose
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            
            # Wait and verify
            sleep 30
            if docker compose -f docker-compose.yml ps | grep -q "Up"; then
              echo "✅ Deployment successful"
              docker compose -f docker-compose.yml ps
            else
              echo "❌ Deployment failed"
              docker compose -f docker-compose.yml logs --tail=50
              exit 1
            fi
            
            # Cleanup .env
            rm -f .env