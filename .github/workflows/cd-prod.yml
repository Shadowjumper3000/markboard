name: CD - Production Deploy

on:
  push:
    branches: [prod]
  workflow_dispatch: {}

jobs:
  deploy:
    name: Deploy to Hetzner
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.SERVER_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.HETZNER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT }}
          script: |
            set -e
            APP_DIR="/home/${{ secrets.HETZNER_USER }}/markboard"
            
            # Create directory if needed
            mkdir -p $APP_DIR && cd $APP_DIR
            
            # Clone or update repository
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git fetch origin && git reset --hard origin/prod && git clean -fd
            fi
            
            # Create .env file from individual secrets
            mkdir -p deployment/compose
            cat > deployment/compose/.env << EOF
            MYSQL_HOST=db
            MYSQL_PORT=3306
            MYSQL_ROOT_PASSWORD=${{ secrets.MYSQL_ROOT_PASSWORD }}
            MYSQL_USER=admin
            MYSQL_PASSWORD=${{ secrets.MYSQL_PASSWORD }}
            MYSQL_DATABASE=markboard
            JWT_SECRET=${{ secrets.JWT_SECRET }}
            FLASK_ENV=production
            DEBUG=false
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            SERVER_NAME=${{ secrets.SERVER_NAME }}
            EOF
            
            # Debug: Check if .env was created and has content
            echo "📋 Checking .env file:"
            ls -lh deployment/compose/.env
            echo "📄 .env has $(wc -l < deployment/compose/.env) lines"
            
            # Deploy with Docker Compose
            cd deployment/compose
            docker compose -f docker-compose.yml down --remove-orphans || true
            docker compose -f docker-compose.yml up -d --build --remove-orphans
            
            # Wait and verify
            sleep 30
            if docker compose -f docker-compose.yml ps | grep -q "Up"; then
              echo "✅ Deployment successful"
              docker compose -f docker-compose.yml ps
            else
              echo "❌ Deployment failed"
              docker compose -f docker-compose.yml logs --tail=50
              exit 1
            fi
            
            # Cleanup .env
            rm -f .env